# fly.toml app configuration file generated for painel-concretagem on 2026-08-14T13:36:19-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'painel-concretagem'
primary_region = 'gru'

[build]
[env]
  DB_PATH = '/data/concretagem.db'
  NODE_ENV = 'production'
  PORT = '3000'
  UPLOADS_PATH = '/data/uploads'

[[mounts]]
  source = 'concretagem_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
