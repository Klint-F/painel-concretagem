app = 'painel-concretagem'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'concretagem_data'
  destination = '/data'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DB_PATH = '/data/concretagem.db'
  UPLOADS_PATH = '/data/uploads'
