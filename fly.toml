app = 'painel-concretagem'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'

[mounts]
  source = "concretagem_data"
  destination = "/app/dados"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1